name: Build Clean Glides for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plugins
        run: cmake --build build --config Release --parallel 3

      - name: Locate plugin bundles
        run: |
          set -euo pipefail
          VST3=$(find build/CleanGlides_artefacts/Release/VST3 -maxdepth 1 -name "*.vst3" | head -n 1)
          AU=$(find build/CleanGlides_MIDIFX_artefacts/Release/AU -maxdepth 1 -name "*.component" | head -n 1)
          [ -n "$VST3" ] || { echo "VST3 bundle not found"; exit 1; }
          [ -n "$AU" ]   || { echo "AU bundle not found"; exit 1; }
          echo "VST3=$VST3" >> "$GITHUB_ENV"
          echo "AU=$AU" >> "$GITHUB_ENV"

      # Build already signs, if this changes, build fails
      - name: Verify signatures and architectures
        run: |
          set -euo pipefail
          for bundle in "$VST3" "$AU"; do
            codesign --verify --deep --strict "$bundle"
            lipo -archs "$bundle"/Contents/MacOS/*
          done

      - name: Validate AU with auval
        run: |
          set -euo pipefail
          PLIST="$AU/Contents/Info.plist"
          TYPE=$(plutil -extract AudioComponents.0.type raw -o - "$PLIST")
          SUBTYPE=$(plutil -extract AudioComponents.0.subtype raw -o - "$PLIST")
          MANUFACTURER=$(plutil -extract AudioComponents.0.manufacturer raw -o - "$PLIST")
          echo "type=$TYPE subtype=$SUBTYPE manufacturer=$MANUFACTURER"

          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$AU" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$AU")"
          killall -9 AudioComponentRegistrar 2>/dev/null || true

          auval -v "$TYPE" "$SUBTYPE" "$MANUFACTURER"

      - name: Create DMGs
        run: |
          set -euo pipefail
          mkdir -p dist

          git fetch --no-tags origin main

          LICENSE_SOURCE=$(mktemp -d)
          trap 'rm -rf "$LICENSE_SOURCE"' EXIT

          git archive FETCH_HEAD assets/fonts/licenses | tar -x -C "$LICENSE_SOURCE"

          test -f LICENSE || { echo "LICENSE not found"; exit 1; }
          test -f THIRD_PARTY_LICENSES.md || {
            echo "THIRD_PARTY_LICENSES.md not found"
            exit 1
          }
          test -d "$LICENSE_SOURCE/assets/fonts/licenses" || {
            echo "Font licenses directory not found"
            exit 1
          }

          make_dmg() {
            local bundle="$1"
            local dest_label="$2"
            local dest_path="$3"
            local dmg_name="$4"

            local name stage
            name=$(basename "$bundle")
            stage=$(mktemp -d)

            ditto "$bundle" "$stage/$name"

            ln -s "$dest_path" "$stage/$dest_label"

            mkdir -p "$stage/Licenses"

            # LICENSE is shipped unchanged, only the extension is added.
            cp LICENSE "$stage/Licenses/LICENSE.txt"

            # THIRD_PARTY_LICENSES.md to plain text:
            #   - strip <h1>..<h6> tags
            #   - strip ** bold markers
            #   - [text](url) -> text (url)
            perl -pe 's{</?h[1-6]>}{}g; s/\*\*//g; s/\[([^\]]+)\]\(([^)]+)\)/$1 ($2)/g' \
              THIRD_PARTY_LICENSES.md > "$stage/Licenses/THIRD_PARTY_LICENSES.txt"

            if grep -qE '</?h[1-6]>|\*\*|\]\(' "$stage/Licenses/THIRD_PARTY_LICENSES.txt"; then
              echo "::error::Markdown/HTML residue left in THIRD_PARTY_LICENSES.txt"
              return 1
            fi

            while IFS= read -r -d '' file; do
              filename=$(basename "$file")
              destination="$stage/Licenses/$filename"

              if [ -e "$destination" ]; then
                prefix=$(basename "$(dirname "$file")")
                destination="$stage/Licenses/${prefix}-${filename}"
              fi

              cp "$file" "$destination"
            done < <(find "$LICENSE_SOURCE/assets/fonts/licenses" -type f -print0)

            test -f "$stage/Licenses/LICENSE.txt" || {
              echo "::error::AGPLv3 LICENSE.txt is missing from DMG"
              return 1
            }

            test -f "$stage/Licenses/THIRD_PARTY_LICENSES.txt" || {
              echo "::error::THIRD_PARTY_LICENSES.txt is missing from DMG"
              return 1
            }

            FONT_LICENSE_COUNT=$(find "$LICENSE_SOURCE/assets/fonts/licenses" \
              -type f | wc -l | tr -d ' ')

            COPIED_FONT_LICENSE_COUNT=$(find "$stage/Licenses" \
              -maxdepth 1 -type f ! -name "LICENSE.txt" \
              ! -name "THIRD_PARTY_LICENSES.txt" | wc -l | tr -d ' ')

            if [ "$FONT_LICENSE_COUNT" -ne "$COPIED_FONT_LICENSE_COUNT" ]; then
              echo "::error::Font license count mismatch!"
              echo "Expected: $FONT_LICENSE_COUNT"
              echo "Copied: $COPIED_FONT_LICENSE_COUNT"
              return 1
            fi

            echo "All licenses successfully included:"
            echo "AGPLv3: OK"
            echo "Third-party licenses: OK"
            echo "Font licenses: $COPIED_FONT_LICENSE_COUNT"

            cat > "$stage/README.txt" <<EOF
          ============================================================
                            CLEAN GLIDES
                       macOS INSTALLATION GUIDE
          ============================================================

          1. INSTALLATION
          ------------------------------------------------------------

          1. Close your DAW (Digital Audio Workstation).
          2. Open this disk image.
          3. Drag "$name" onto the "$dest_label" shortcut.
          4. If prompted, choose "Replace" to overwrite an older version.
          5. macOS quarantine removal may be necessary for the plugin
             to work. Please read the Security Notice below to learn
             how to proceed.
          6. Restart your DAW.

          2. macOS SECURITY NOTICE - QUARANTINE
          ------------------------------------------------------------

          IMPORTANT: This release is not notarized by Apple.

          macOS uses Gatekeeper and quarantine metadata to help protect
          your computer from potentially unsafe downloaded software.

          Because Clean Glides is not notarized, macOS may prevent the
          plugin from loading.

          If you have independently verified that you trust this
          software and obtained it from the official Clean Glides
          distribution, you may choose to remove its quarantine
          metadata.

          SECURITY DISCLAIMER:

          Removing quarantine metadata bypasses an additional macOS
          security check. It does NOT verify the software, establish
          its integrity, or guarantee that it is safe.

          Only proceed if you understand and accept this risk.
          Never execute commands from an untrusted source.

          HOW TO OPEN TERMINAL:

          1. Press Command (⌘) + Space on your keyboard.
          2. Type "Terminal".
          3. Press Return.

          REMOVE THE QUARANTINE ATTRIBUTE:

          1. Copy and paste the following command into Terminal:

              sudo xattr -dr com.apple.quarantine "$dest_path/$name"

          2. Press Return.
          3. macOS will request your administrator password.
          4. Enter your password and press Return.

          NOTE: Terminal does not display characters while you type
          your password. This is normal.

          This command removes quarantine metadata recursively from
          this plugin bundle only. It does not disable Gatekeeper
          globally.

          5. Restart your DAW after completing these steps.

          3. OPEN-SOURCE SOFTWARE AND LICENSING
          ------------------------------------------------------------

          Clean Glides is open-source software licensed under AGPLv3.

          The complete corresponding source code is available at:

          https://github.com/AbriCroco/Clean-Glides/tree/1.0.0

          This source code corresponds to version 1.0.0.

          This distribution also includes third-party software and
          fonts, which may be subject to their own licensing terms.

          All relevant license documents are included in the
          "Licenses" folder at the root of this disk image.

          This includes:

          - LICENSE.txt (AGPLv3)
          - THIRD_PARTY_LICENSES.txt
          - All individual font license files.

          Please consult these documents for the complete licensing
          terms and attribution requirements.

          ============================================================
                         THANK YOU FOR USING
                            CLEAN GLIDES
          ============================================================
          EOF

            local created=false

            for attempt in 1 2 3; do
              if hdiutil create \
                -volname "CleanGlides $dest_label" \
                -srcfolder "$stage" \
                -ov -format UDZO \
                "dist/$dmg_name"; then
                created=true
                break
              fi

              echo "hdiutil failed (attempt $attempt), retrying..."
              sleep 5
            done

            if [ "$created" != true ]; then
              echo "Failed to create $dmg_name"
              rm -rf "$stage"
              return 1
            fi

            rm -rf "$stage"
          }

          make_dmg "$VST3" \
            "VST3 (drag plugin here)" \
            "/Library/Audio/Plug-Ins/VST3" \
            "Clean Glides_VST3.dmg"

          make_dmg "$AU" \
            "Components (drag plugin here)" \
            "/Library/Audio/Plug-Ins/Components" \
            "Clean Glides_AU.dmg"

          echo "Generated disk images:"
          ls -lh dist

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: CleanGlides-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3